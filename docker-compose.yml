services:
  db:
    image: postgres:16-alpine
    container_name: julia_db
    environment:
      POSTGRES_USER: julia
      POSTGRES_PASSWORD: julia123
      POSTGRES_DB: julia
    ports:
      - "5433:5432"
    volumes:
      - julia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  julia_pgdata:
