name: CI frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      # Va último: el entorno de Vitest regenera .nuxt sin el módulo PWA,
      # y el typecheck necesita los tipos con PWA incluido.
      - name: Tests con gate de coverage
        run: npx vitest run --coverage
